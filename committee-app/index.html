<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123552"><meta name="apple-mobile-web-app-capable" content="yes"><title>紘嘉社區管委會 APP</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="app.css"></head><body>
<section id="login" class="login"><article><div class="logo">HJ</div><small>HONG JIA COMMUNITY</small><h1>社區管委會 APP</h1><p>請使用 ERP 已授權的 Email 登入。</p><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>密碼<input name="password" type="password" minlength="8" required></label><button>登入</button></form><button id="signup" class="secondary">首次使用｜建立密碼</button><button id="resetPassword" class="secondary" type="button">忘記密碼／重寄設定信</button><p id="loginMessage"></p></article></section>
<div id="app" hidden><header><div><small id="role">管委會</small><h1 id="siteName">社區</h1></div><button id="logout">登出</button></header><main><section id="overview" class="view active"><div class="hero"><small>COMMUNITY OVERVIEW</small><h2 id="welcome">您好</h2><p>社區公開勤務與行政工作進度，一處掌握。</p></div><div class="stats"><article><small>本月勤務</small><strong id="scheduleCount">0</strong></article><article><small>工作日誌</small><strong id="logCount">0</strong></article><article><small>待處理事項</small><strong id="pendingCount">0</strong></article></div><article class="card"><h3>社區資訊</h3><div id="siteInfo"></div></article><article class="card"><h3>最新工作進度</h3><div id="latestLogs"></div></article></section><section id="schedule" class="view"><div class="view-title"><div><small>社區勤務</small><h2>當月排班表</h2></div><input id="month" type="month"></div><article class="card schedule-card"><div id="scheduleTable"></div></article></section><section id="logs" class="view"><div class="view-title"><div><small>總幹事／秘書</small><h2>工作日誌</h2></div><input id="logMonth" type="month"></div><div id="logList"></div></section></main><nav><button data-view="overview" class="active"><b>總</b><span>總覽</span></button><button data-view="schedule"><b>班</b><span>班表</span></button><button data-view="logs"><b>誌</b><span>日誌</span></button></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../erp-v2/config.js?v=41"></script><script src="app.js?v=3"></script></body></html>
