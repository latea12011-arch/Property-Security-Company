<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123552"><meta name="apple-mobile-web-app-capable" content="yes"><title>紘嘉社區管委會 APP</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="app.css?v=2"><link rel="stylesheet" href="extras.css?v=1"></head><body>
<section id="login" class="login"><article><div class="logo">HJ</div><small>HONG JIA COMMUNITY</small><h1>社區管委會 APP</h1><p>請使用 ERP 已授權的 Email 登入。</p><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>密碼<input name="password" type="password" minlength="8" required></label><button>登入</button></form><button id="signup" class="secondary">首次使用｜建立密碼</button><button id="resetPassword" class="secondary" type="button">忘記密碼／重寄設定信</button><p id="loginMessage"></p></article></section>
<section id="passwordSetup" class="password-setup" hidden><article><div class="logo">HJ</div><small>HONG JIA COMMUNITY</small><h2>設定登入密碼</h2><p>請設定至少 8 碼的新密碼，完成後即可登入管委會 APP。</p><form id="passwordSetupForm"><label>新密碼<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>再次輸入<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label><button>儲存新密碼</button></form><p id="passwordSetupMessage"></p></article></section>
<div id="app" hidden><header><div><small id="role">管委會</small><h1 id="siteName">社區</h1></div><button id="logout">登出</button></header><main><section id="overview" class="view active"><div class="hero"><small>COMMUNITY OVERVIEW</small><h2 id="welcome">您好</h2><p>本帳號的社區由 ERP 管理者指定，無法自行切換或查看其他社區。</p></div><div class="stats"><article><small>本月勤務</small><strong id="scheduleCount">0</strong></article><article><small>工作日誌</small><strong id="logCount">0</strong></article><article><small>待處理事項</small><strong id="pendingCount">0</strong></article></div><article class="card"><h3>社區資訊</h3><div id="siteInfo"></div></article><article class="card"><h3>最新工作進度</h3><div id="latestLogs"></div></article></section><section id="schedule" class="view"><div class="view-title"><div><small>社區勤務</small><h2>當月排班表</h2></div><input id="month" type="month"></div><article class="card schedule-card"><div id="scheduleTable"></div></article></section><section id="logs" class="view"><div class="view-title"><div><small>總幹事／秘書</small><h2>工作日誌</h2></div><input id="logMonth" type="month"></div><div id="logList"></div></section><section id="items" class="view"><div class="view-title"><div><small>COMMITTEE FEEDBACK</small><h2>建議與提醒</h2></div></div><article class="card"><form id="committeeItemForm"><label>事項類型<select name="item_type"><option value="suggestion">委員建議事項</option><option value="reminder">提醒事項</option></select></label><label>主旨<input name="title" maxlength="100" required></label><label>內容<textarea name="content" rows="6" required></textarea></label><button>送出給 ERP 管理者</button></form><p id="itemMessage"></p></article><article class="card"><h3>已送出事項</h3><div id="itemList"></div></article></section></main><nav><button data-view="overview" class="active"><b>總</b><span>總覽</span></button><button data-view="schedule"><b>班</b><span>班表</span></button><button data-view="logs"><b>誌</b><span>日誌</span></button><button data-view="items"><b>議</b><span>建議</span></button></nav></div>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="../erp-v2/config.js?v=41"></script><script defer src="app.js?v=6"></script></body></html>
